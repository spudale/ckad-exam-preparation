apiVersion: v1
kind: Namespace
metadata:
  name: ckad-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: ckad-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
    spec:
      containers:
        - name: toolbox
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]

