apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ckad-canary
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: storefront
      track: stable
  template:
    metadata:
      labels:
        app: storefront
        track: stable
    spec:
      containers:
        - name: storefront
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-canary
  namespace: ckad-canary
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: storefront
      track: canary
  template:
    metadata:
      labels:
        app: storefront
        track: canary
    spec:
      containers:
        - name: storefront
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
