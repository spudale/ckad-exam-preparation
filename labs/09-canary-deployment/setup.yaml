apiVersion: v1
kind: Namespace
metadata:
  name: ckad-canary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ckad-canary
spec:
  replicas: 5
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ckad-canary
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
