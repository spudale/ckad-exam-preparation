apiVersion: v1
kind: Namespace
metadata:
  name: ckad-container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ckad-container
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: old-container
          image: nginx:1.24-alpine

