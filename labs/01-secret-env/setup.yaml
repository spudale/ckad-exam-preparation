apiVersion: v1
kind: Namespace
metadata:
  name: ckad-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-client
  namespace: ckad-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-client
  template:
    metadata:
      labels:
        app: postgres-client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: POSTGRES_DB
              value: inventory
            - name: POSTGRES_PASSWORD
              value: ckad-password

