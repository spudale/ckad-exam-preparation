apiVersion: v1
kind: Namespace
metadata:
  name: ckad-rollout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ckad-rollout
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.24-alpine

