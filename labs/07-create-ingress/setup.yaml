apiVersion: v1
kind: Namespace
metadata:
  name: ckad-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ckad-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ckad-ingress
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80

