apiVersion: v1
kind: Namespace
metadata:
  name: ckad-ingress-fix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ckad-ingress-fix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ckad-ingress-fix
spec:
  selector:
    app: catalogue
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  namespace: ckad-ingress-fix
spec:
  ingressClassName: nginx
  rules:
    - host: catalog.ckad.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalogtest
                port:
                  number: 80

